services:
  cache:
    image: redis:8.4.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - just_stash_it
  api:
    image: just-stash-it-app
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - $PWD:/var/www/html
      - $PWD/nginx:/etc/nginx/conf.d
    networks:
      - just_stash_it
    depends_on:
      - cache

networks:
  just_stash_it:
    driver: bridge
